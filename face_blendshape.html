
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Blendshape - Chiraphut27</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #status {
      position: absolute;
      z-index: 10;
      top: 15px;
      left: 15px;
      right: 15px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      text-align: center;
      font-size: 14px;
    }

    #info {
      position: absolute;
      z-index: 10;
      bottom: 15px;
      left: 15px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">กำลังโหลดระบบ...</div>
  <div id="info">Chiraphut27 | Face Blendshape</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');

    async function startApp() {
      const mindar = new MindARThree({
        container: container
      });

      const { renderer, scene, camera } = mindar;

      scene.add(
        new THREE.HemisphereLight(
          0xffffff,
          0x444466,
          1.5
        )
      );

      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(0, 1, 3);
      scene.add(light);

      // โหลดโมเดลใบหน้าของคุณจาก GitHub Pages
      const modelURL =
        './' + encodeURIComponent('หน้าตา2416.glb');

      status.textContent = 'กำลังโหลดโมเดล 3D...';

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(modelURL);
      const model = gltf.scene;

      // ปรับขนาดโมเดลได้ตรงนี้
      model.scale.setScalar(2);

      // ติดตามตำแหน่งใบหน้า
      const anchor = mindar.addAnchor(1);
      anchor.group.add(model);

      // ค้นหา Mesh ที่มี Morph Targets
      const meshes = [];

      model.traverse(object => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          meshes.push(object);
        }
      });

      console.log('จำนวน Mesh:', meshes.length);

      meshes.forEach(mesh => {
        console.log(
          'ชื่อ Mesh:', mesh.name,
          'Morph Targets:',
          mesh.morphTargetDictionary
        );
      });

      status.textContent = 'กำลังเปิดกล้อง...';

      await mindar.start();

      status.textContent =
        meshes.length > 0
          ? 'ระบบพร้อมใช้งาน'
          : 'โหลดโมเดลแล้ว แต่ไม่พบ Morph Targets';

      renderer.setAnimationLoop(() => {
        const categories =
          mindar.getLatestEstimate()?.blendshapes?.categories ?? [];

        for (const mesh of meshes) {
          for (const item of categories) {
            const index =
              mesh.morphTargetDictionary[item.categoryName];

            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = item.score;
            }
          }
        }

        renderer.render(scene, camera);
      });
    }

    startApp().catch(error => {
      console.error(error);
      status.textContent =
        'เกิดข้อผิดพลาด กรุณาตรวจสอบชื่อไฟล์โมเดลและการอนุญาตใช้กล้อง';
    });
  </script>
</body>
</html>
