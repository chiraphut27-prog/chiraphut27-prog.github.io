
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face2416 - Blendshape Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      color: white;
      background: #0009;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">กำลังโหลดโมเดล...</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');

    async function main() {
      const mindar = new MindARThree({
        container,
        maxTrack: 1
      });

      const { renderer, scene, camera } = mindar;

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      scene.add(
        new THREE.HemisphereLight(0xffffff, 0x777788, 2)
      );

      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(0, 1, 3);
      scene.add(light);

      // โหลดโมเดลจาก Repository เดียวกัน
      const gltf = await new GLTFLoader().loadAsync(
        './face2416.glb'
      );

      const head = gltf.scene;

      // ปรับขนาดโมเดลตรงนี้
      head.scale.multiplyScalar(0.8);

      // ปรับตำแหน่งโมเดลได้ตรงนี้
      head.position.set(0, -0.2, 0);

      const meshes = [];

      head.traverse((object) => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          meshes.push(object);
          console.log(
            'Blend Shapes:',
            object.morphTargetDictionary
          );
        }
      });

      const anchor = mindar.addAnchor(168);
      anchor.group.add(head);

      await mindar.start();

      status.textContent = 'เปิดกล้องแล้ว กำลังตรวจจับใบหน้า';

      function animate() {
        const estimate = mindar.getLatestEstimate();
        const categories =
          estimate?.blendshapes?.categories ?? [];

        for (const mesh of meshes) {
          const dictionary = mesh.morphTargetDictionary;
          const influences = mesh.morphTargetInfluences;

          for (const item of categories) {
            const index = dictionary[item.categoryName];

            if (index !== undefined) {
              const target = item.score;

              // ปรับให้การแสดงสีหน้าดูนุ่มนวล
              influences[index] +=
                (target - influences[index]) * 0.45;
            }
          }
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();
    }

    main().catch((error) => {
      console.error(error);
      status.textContent =
        'เปิดไม่สำเร็จ กรุณาอนุญาตกล้องและตรวจสอบไฟล์โมเดล';
    });
  </script>
</body>
</html>
