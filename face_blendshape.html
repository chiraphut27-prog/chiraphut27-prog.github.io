
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newface2416 - Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
    }

    #video, #canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
    }

    #video { display: none; }

    #status {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      color: white;
      background: #000b;
      border-radius: 10px;
    }

    #start {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">กดเปิดกล้องเพื่อเริ่มต้น</div>
  <button id="start">เปิดกล้อง</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import {
  FaceLandmarker,
  FilesetResolver
} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';

const video = document.querySelector('#video');
const canvas = document.querySelector('#canvas');
const status = document.querySelector('#status');
const button = document.querySelector('#start');

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35, innerWidth / innerHeight, 0.01, 100
);
camera.position.set(0, 0, 5);

scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(1, 2, 5);
scene.add(light);

let head;
let meshes = [];
let landmarker;
let lastVideoTime = -1;

const MODEL_SCALE = 1;
const SMOOTHING = 0.35;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

async function initialize() {
  status.textContent = 'กำลังโหลด Newface2416.glb...';

  // โหลดโมเดลของคุณ
  const gltf = await new GLTFLoader().loadAsync(
    './Newface2416.glb'
  );

  head = gltf.scene;
  head.scale.setScalar(MODEL_SCALE);
  scene.add(head);

  head.traverse(obj => {
    if (
      obj.isMesh &&
      obj.morphTargetDictionary &&
      obj.morphTargetInfluences
    ) {
      meshes.push(obj);
      console.log('Morph targets:', obj.morphTargetDictionary);
    }
  });

  status.textContent = meshes.length
    ? 'พบ Blend Shapes กำลังเตรียมกล้อง...'
    : 'โหลดโมเดลแล้ว แต่ไม่พบ Blend Shapes';

  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  landmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numFaces: 1,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true
  });
}

function updateBlendshapes(result) {
  const categories =
    result.faceBlendshapes?.[0]?.categories ?? [];

  for (const mesh of meshes) {
    const dict = mesh.morphTargetDictionary;
    const values = mesh.morphTargetInfluences;

    for (const item of categories) {
      const index = dict[item.categoryName];

      if (index !== undefined) {
        values[index] +=
          (item.score - values[index]) * SMOOTHING;
      }
    }
  }
}

function updateHead(result) {
  const landmarks = result.faceLandmarks?.[0];
  if (!head || !landmarks) return;

  const left = landmarks[33];
  const right = landmarks[263];

  const x = (left.x + right.x) / 2;
  const y = (left.y + right.y) / 2;

  head.position.x +=
    ((0.5 - x) * 3 - head.position.x) * SMOOTHING;

  head.position.y +=
    ((0.5 - y) * 2 - head.position.y) * SMOOTHING;

  const angle = Math.atan2(
    right.y - left.y,
    right.x - left.x
  );

  head.rotation.z +=
    (-angle - head.rotation.z) * SMOOTHING;
}

function animate() {
  requestAnimationFrame(animate);

  if (
    landmarker &&
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {
    lastVideoTime = video.currentTime;

    const result = landmarker.detectForVideo(
      video, performance.now()
    );

    updateBlendshapes(result);
    updateHead(result);

    status.textContent = result.faceLandmarks?.length
      ? 'ตรวจพบใบหน้าแล้ว'
      : 'กรุณาหันหน้าเข้าหากล้อง';
  }

  renderer.render(scene, camera);
}

button.addEventListener('click', async () => {
  button.disabled = true;
  status.textContent = 'กำลังเปิดระบบ...';

  try {
    await initialize();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    // กลับภาพกล้องให้เหมือนกระจก
    video.style.transform = 'scaleX(-1)';

    button.style.display = 'none';
    status.textContent = 'เปิดกล้องสำเร็จ';
    animate();
  } catch (error) {
    console.error(error);
    status.textContent =
      'ผิดพลาด: ' + error.message +
      ' — ตรวจสอบชื่อไฟล์และสิทธิ์กล้อง';
    button.disabled = false;
  }
});
</script>
</body>
</html>
