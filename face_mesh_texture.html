<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mesh Texture AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
    #hint {
      position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px;
      text-align: center; color: white; font: 16px Arial, sans-serif;
      text-shadow: 0 1px 5px #000; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">อนุญาตให้ใช้กล้อง แล้วหันหน้าเข้าหากล้อง</div>
  <a-scene mindar-face="autoStart: true; faceOccluder: false"
           embedded vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">
    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    scene.addEventListener('arReady', () => {
      const THREE = AFRAME.THREE;
      // ใช้ texture ตัวอย่างจากเว็บต้นฉบับ หากมีภาพ UV texture ของตัวเองให้นำ URL มาแทนบรรทัดนี้
      const texture = new THREE.TextureLoader().load(
        'https://kan18122004-beep.github.io/pngblack.png',
        () => { texture.needsUpdate = true; },
        undefined,
        (error) => console.error('โหลดภาพ texture ไม่สำเร็จ', error)
      );
      texture.colorSpace = THREE.SRGBColorSpace;

      const faceEntity = document.querySelector('#face');
      const mesh = faceEntity.getObject3D('mesh');
      if (!mesh) {
        console.error('ไม่พบ face mesh');
        return;
      }
      if (mesh.material) mesh.material.dispose();
      mesh.material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      mesh.frustumCulled = false;
    });
  </script>
</body>
</html>
